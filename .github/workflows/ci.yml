name: CI

on:
  push:
    branches: [main, rc]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # What a change touches: a docs-only change runs nothing heavy, a web-only change skips Rust.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - "crates/**"
              - "Cargo.*"
              - ".cargo/**"
              - "rustfmt.toml"
              - "agents/**"
              - "config/**"
              - "package.json"
              - "package-lock.json"
              - "web/src/shared/api/generated/**"
              - ".github/workflows/ci.yml"
            web:
              - "web/**"
              - "test/**"
              - "bench/**"
              - "crates/genie/pi/**"
              - "package.json"
              - "package-lock.json"
              - "tsconfig.json"
              - ".github/workflows/ci.yml"

  lint:
    name: Rust format and lint
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Pull requests reuse main's cache and do not write their own (no eviction churn).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Rust tests
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # The live-session tests drive the real pi harness from node_modules.
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # mold links the test binaries several times faster than the default linker.
      - uses: rui314/setup-mold@v1
      # The agent sandbox: bubblewrap, with the unprivileged user namespaces Ubuntu restricts by default.
      - name: Sandbox
        run: |
          # The runner's package lists are usually fresh enough; refresh them only when the install fails.
          sudo apt-get install -y -q --no-install-recommends bubblewrap \
            || { sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends bubblewrap; }
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Why rebuild (diagnostics)
        run: |
          cargo build --workspace --tests -v 2>&1 | grep -E "Dirty|Fresh" | head -30 || true
          ls -la --time-style=full-iso ~/.cargo/registry/src/*/proc-macro2-*/build.rs target/debug/build/proc-macro2-*/output 2>&1 | head || true
      - name: Test
        # The live-session tests run the real pi harness inside the sandbox too. No doc tests: there are none.
        env:
          GENIE_REQUIRE_SANDBOX: 1
          GENIE_TEST_SANDBOX: bwrap
          # Most tests wait on agent processes and timers, not the CPU: twice the runner's 4 cores
          # (measured: 18 s → 15 s; 16 threads starts to starve the timing-sensitive tests).
          RUST_TEST_THREADS: 8
        run: cargo test --workspace --lib --bins --tests
      # `cargo test` writes the API types for the web from the Rust structs (ts-rs).
      - name: API types for the web are committed
        run: |
          stale="$(git status --porcelain -- web/src/shared/api/generated)"
          if [ -n "$stale" ]; then
            echo "$stale"
            echo "::error::cargo test changed web/src/shared/api/generated: commit the regenerated types"
            exit 1
          fi

  web:
    name: TypeScript tools and web UI
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build:web
