name: CI

on:
  push:
    branches: [main, rc]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # The live-session tests drive the real pi harness from node_modules.
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      # The agent sandbox: bubblewrap, with the unprivileged user namespaces Ubuntu restricts by default.
      - name: Sandbox
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Test
        # The live-session tests run the real pi harness inside the sandbox too.
        env:
          GENIE_REQUIRE_SANDBOX: 1
          GENIE_TEST_SANDBOX: bwrap
        run: cargo test --workspace
      # `cargo test` writes the API types for the web from the Rust structs (ts-rs).
      - name: API types for the web are committed
        run: |
          stale="$(git status --porcelain -- web/src/shared/api/generated)"
          if [ -n "$stale" ]; then
            echo "$stale"
            echo "::error::cargo test changed web/src/shared/api/generated: commit the regenerated types"
            exit 1
          fi

  web:
    name: TypeScript tools and web UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build:web
