name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # What a change touches: a docs-only change runs nothing heavy, a web-only change skips Rust.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
      rust: ${{ steps.filter.outputs.rust }}
      web: ${{ steps.filter.outputs.web }}
      preview: ${{ steps.filter.outputs.preview }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docker:
              - "docker/**"
              - ".github/workflows/**"
            rust:
              - "docker/Dockerfile"
              - ".github/scripts/install-pi-bolt.sh"
              - "crates/**"
              - "Cargo.*"
              - ".cargo/**"
              - "rustfmt.toml"
              - "agents/**"
              - "config/**"
              - "package.json"
              - "package-lock.json"
              - "web/src/shared/api/generated/**"
              - ".github/workflows/**"
            web:
              - "web/**"
              - "test/**"
              - "bench/**"
              - "crates/genie/pi/**"
              - "package.json"
              - "package-lock.json"
              - "tsconfig.json"
              - "steiger.config.ts"
              - ".github/workflows/**"
            preview:
              - "scripts/preview/**"
              - ".github/workflows/**"

  preview:
    name: Preview tools
    needs: changes
    if: needs.changes.outputs.preview == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s scripts/preview -p 'test_*.py'

  lint:
    name: Rust format and lint
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # rust-cache keys on the dependencies and the toolchain, not on [profile]: a profile change
          # would keep restoring the old build, which is never replaced (a key is written once).
          key: ${{ hashFiles('Cargo.toml') }}
          # Pull requests reuse main's cache and do not write their own (no eviction churn).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Rust tests
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Node runs the fake stdio MCP servers; live sessions use the shipped native harness.
      - name: Pi-Bolt
        run: |
          bash .github/scripts/install-pi-bolt.sh "$RUNNER_TEMP/pi-bolt"
          echo "$RUNNER_TEMP/pi-bolt" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('Cargo.toml') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # mold links the test binaries several times faster than the default linker.
      - uses: rui314/setup-mold@v1
      # The agent sandbox: bubblewrap, with the unprivileged user namespaces Ubuntu restricts by default.
      # Rootless Podman for the environment runner tests.
      - name: Sandbox
        run: |
          pkgs="bubblewrap podman slirp4netns uidmap fuse-overlayfs catatonit"
          # The runner's package lists are usually fresh enough; refresh them only when the install fails.
          sudo apt-get install -y -q --no-install-recommends $pkgs \
            || { sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends $pkgs; }
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Test
        # The live-session tests run the real pi harness inside the sandbox too. No doc tests: there are none.
        env:
          GENIE_REQUIRE_SANDBOX: 1
          GENIE_TEST_SANDBOX: bwrap
          GENIE_TEST_PODMAN: 1
          # Most tests wait on agent processes and timers, not the CPU: twice the runner's 4 cores
          # (measured: 18 s → 15 s; 16 threads starts to starve the timing-sensitive tests).
          RUST_TEST_THREADS: 8
        run: cargo test --workspace --lib --bins --tests
      # `cargo test` writes the API types for the web from the Rust structs (ts-rs).
      - name: API types for the web are committed
        run: |
          stale="$(git status --porcelain -- web/src/shared/api/generated)"
          if [ -n "$stale" ]; then
            echo "$stale"
            echo "::error::cargo test changed web/src/shared/api/generated: commit the regenerated types"
            exit 1
          fi

  web:
    name: TypeScript tools and web UI
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint:web
      - run: npm run build:web

  ui:
    name: Browser tests
    needs: changes
    # The screens depend on the web and on the server that answers them.
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('Cargo.toml') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: rui314/setup-mold@v1
      # The server is built before web/dist exists, so it does not embed the UI and is not rebuilt
      # by a web-only change: the tests serve the fresh web/dist with `serve --web`.
      - run: cargo build --locked -p genie
      - run: npm run build:web
      # Seeds two servers and runs Playwright in the image pinned to the installed version.
      - run: npm run test:ui
      - name: Upload the report, traces and screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-tests
          path: test-results/
          retention-days: 14

  docker:
    name: Docker build definition
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Check build definition
        run: docker buildx build --check -f docker/Dockerfile .
      - name: Check shell syntax
        run: bash -n docker/*.sh
      - name: Check compose configuration
        run: docker compose -f docker/docker-compose.yml config --quiet

  main-release-gate:
    name: Main release gate
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require dev as the source and a versioned release
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/release_gate.py

  quality-gate:
    name: Quality gate
    if: always()
    needs: [changes, lint, test, web, ui, docker, preview, main-release-gate]
    runs-on: ubuntu-latest
    steps:
      - name: Require all applicable checks to pass
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          results = {name: job["result"] for name, job in json.loads(os.environ["NEEDS"]).items()}
          failures = {name: result for name, result in results.items() if result in {"failure", "cancelled"}}
          if failures:
              print(f"Applicable checks failed: {failures}")
              sys.exit(1)
          print(f"Applicable checks passed: {results}")
          PY
