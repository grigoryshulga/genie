<!doctype html>
<html lang="en" data-theme="ink">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Genie design system</title>
<link rel="stylesheet" href="/src/app/styles.css">
<style>
  body { overflow: auto; }
  .catalog { max-width: 1000px; margin: auto; padding: var(--g-space-6); display: grid; gap: var(--g-space-5); }
  .catalog h2 { margin: 0 0 var(--g-space-3); }
  .catalog .specimen-block { padding: var(--g-space-4); border: 1px solid var(--g-border); border-radius: var(--g-radius-lg); background: var(--g-surface); }
  .samples, .toolbar { display: flex; flex-wrap: wrap; gap: var(--g-space-3); align-items: center; }
  .toolbar { margin: 0 0 var(--g-space-4); }
  .toolbar label { display: flex; gap: var(--g-space-2); align-items: center; color: var(--g-text-2); }
  .toolbar select { background: var(--g-surface-raised); color: var(--g-text); border: 1px solid var(--g-border-strong); border-radius: var(--g-radius-sm); padding: var(--g-space-1) var(--g-space-2); }
  .swatch { min-width: 125px; flex: 1; }
  .swatch i { display: block; height: 44px; border: 1px solid var(--g-border-strong); border-radius: var(--g-radius-sm); margin-bottom: var(--g-space-1); }
  .swatch code { color: var(--g-text-muted); font-family: var(--g-font-mono); font-size: var(--g-text-caption); }
  .catalog .g-field { width: min(260px, 100%); }
  .statuses > span { display: inline-flex; gap: var(--g-space-1); align-items: center; color: var(--g-text-2); }
  @media (max-width: 600px) { .catalog { padding: var(--g-space-3); } }
</style>
<main class="catalog">
  <header>
    <p class="g-eyebrow">Foundations</p>
    <h1 class="g-h1">Genie design system</h1>
    <p class="g-caption">Live specimens rendered by the shared kit against <code>g-tokens.css</code>. Rules, tokens, and the Figma import are in <code>design-system/README.md</code>.</p>
  </header>
  <div class="toolbar">
    <label>Theme <select id="theme"><option value="ink">ink</option><option value="paper">paper</option></select></label>
  </div>
  <div id="root"></div>
</main>
<script type="module">
  import React from "react";
  import { createRoot } from "react-dom/client";
  import * as kit from "/src/shared/ui/index.ts";
  import { StatusIcon, PriorityIcon } from "/src/entities/task/ui/StatusIcon.tsx";

  document.getElementById("theme").onchange = (event) => { document.documentElement.dataset.theme = event.target.value; };
  const h = React.createElement;

  /** A specimen block: a heading and whatever the kit renders underneath it. */
  const block = (title, ...children) => h("section", { key: title, className: "specimen-block" }, h("h2", { className: "g-h4" }, title), ...children);
  const row = (...children) => h("div", { className: "samples" }, ...children);

  const colors = ["bg", "surface", "surface-raised", "surface-hover", "border-strong", "text", "text-2", "text-muted", "accent", "signal", "danger", "viz-1", "viz-2", "viz-3", "viz-4"];
  const statuses = ["inbox", "draft", "refining", "ready", "in_progress", "changes_requested", "review", "approved", "needs_owner", "done", "cancelled"];

  createRoot(document.getElementById("root")).render(h(React.Fragment, null,
    block("Surfaces and semantic colour",
      row(...colors.map((name) => h("div", { key: name, className: "swatch" },
        h("i", { style: { background: `var(--g-${name})` } }),
        h("code", null, `--g-${name}`))))),
    block("Buttons",
      row(h(kit.Button, null, "Secondary"),
        h(kit.Button, { variant: "primary" }, "Primary"),
        h(kit.Button, { variant: "ghost" }, "Ghost"),
        h(kit.Button, { variant: "danger" }, "Danger"),
        h(kit.Button, { variant: "primary", disabled: true }, "Disabled"),
        h(kit.Button, { variant: "primary", busy: true }, "Busy"),
        h(kit.Button, { sm: true }, "Dense"),
        h(kit.IconButton, { label: "More actions" }, "⋯"))),
    block("Tabs, segments, chips, tags, key caps",
      row(h(kit.Tabs, { label: "Views", value: "board", items: [{ id: "board", label: "Board" }, { id: "list", label: "List" }] }),
        h(kit.Segmented, { label: "Density", value: "roomy", onChange: () => {}, items: [{ id: "roomy", label: "Roomy" }, { id: "dense", label: "Dense" }] }),
        h(kit.Chip, { pressed: true }, "Selected chip"),
        h(kit.Chip, null, "Chip"),
        ...["neutral", "accent", "signal", "danger", "solid-accent", "solid-signal", "outline"].map((tone) => h(kit.Tag, { key: tone, tone }, tone)),
        h("span", null, "Search ", h(kit.Kbd, null, "⌘K")))),
    block("Fields",
      row(h(kit.Field, { label: "Name", help: "Shown in the sidebar" }, h(kit.Input, { placeholder: "Project name", defaultValue: "" })),
        h(kit.Field, { label: "Status" }, h(kit.Select, { defaultValue: "ready" }, h("option", { value: "ready" }, "Ready for work"), h("option", { value: "in_progress" }, "In progress"))),
        h(kit.Field, { label: "Notes" }, h(kit.Textarea, { rows: 2, defaultValue: "" })),
        h(kit.SearchField, { label: "Search tasks", placeholder: "Search" })),
      row(h(kit.Checkbox, { label: "Checkbox", defaultChecked: true }), h(kit.Radio, { label: "Radio", defaultChecked: true }), h(kit.Switch, { label: "Switch", defaultChecked: true }))),
    block("Feedback",
      row(h(kit.Banner, { tone: "accent", title: "Accent banner" }, "System state."),
        h(kit.Banner, { tone: "signal", title: "Signal banner" }, "Something waits for you."),
        h(kit.Banner, { tone: "danger", title: "Danger banner" }, "A run failed.")),
      row(h(kit.Card, null, h(kit.Stat, { value: "12", label: "Open tasks" }), h(kit.Progress, { value: 0.4, label: "Progress" }), h(kit.Segments, { total: 8, done: 3, label: "Acceptance" })),
        h(kit.EmptyState, { title: "No tasks yet", action: h(kit.Button, { variant: "primary" }, "Create a task") }, "The board fills as work is planned."),
        h(kit.ErrorState, { message: "Could not load the board" })),
      row(h(kit.Avatar, { kind: "human", name: "Olga" }), h(kit.Avatar, { kind: "agent", name: "Planner", sm: true }), h(kit.Skeleton, {}))),
    block("Status and priority",
      h("div", { className: "samples statuses" },
        ...statuses.map((status) => h("span", { key: status }, h(StatusIcon, { status, size: 16 }), status)),
        ...[0, 1, 2, 3, 4].map((priority) => h("span", { key: priority }, h(PriorityIcon, { priority, size: 16 }), `P${priority}`)))),
    block("Typography",
      h("p", { className: "g-display" }, "Display"),
      h("p", { className: "g-h1" }, "H1 · Unbounded"),
      h("p", { className: "g-h2" }, "H2 · Unbounded"),
      h("p", { className: "g-h3" }, "H3 · Manrope"),
      h("p", { className: "g-h4" }, "H4 · Manrope"),
      h("p", null, "Body · Manrope 400"),
      h("p", { className: "g-caption" }, "Caption · Manrope 500"),
      h("p", { className: "g-eyebrow" }, "Eyebrow"),
      h("p", { style: { fontFamily: "var(--g-font-mono)" } }, "GNE-69 · Geist Mono")),
    block("Disclosure cards",
      h(kit.DisclosureCard, { title: "Properties", storageKey: "genie.specimen.card.open" }, h("p", { className: "g-caption" }, "Open card: heading toggles with Enter or Space.")),
      h(kit.DisclosureCard, { title: "Related pages", storageKey: "genie.specimen.card.closed", defaultOpen: false }, h("p", { className: "g-caption" }, "Closed card: the choice survives a reload."))),
    block("Dialog",
      h("div", { className: "g-modal", role: "group", "aria-label": "Dialog specimen" },
        h("header", null, h("h2", null, "Dialog heading")),
        h("div", { className: "g-modal-body" }, h(kit.Field, { label: "Title" }, h(kit.Input, { defaultValue: "A shared design language" })), h("p", { className: "g-caption" }, "Surface, border, radius and overlay shadow.")),
        h("footer", null, h("span", { className: "grow" }), h(kit.Button, { variant: "ghost" }, "Cancel"), h(kit.Button, { variant: "primary" }, "Save"))))
  ));
</script>
</html>
