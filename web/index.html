<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#09090d" />
    <script>
      // Apply the saved theme before first paint so there is no flash. Mirrors shared/lib/appearance.ts.
      (function () {
        try {
          var pref = localStorage.getItem("genie.appearance.theme");
          var theme = pref === "paper" || pref === "light" ? "paper" : pref === "system" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "ink" : "paper") : "ink";
          document.documentElement.dataset.theme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.content = theme === "paper" ? "#f4f1ea" : "#09090d";
        } catch (e) {}
      })();
    </script>
    <title>genie</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
