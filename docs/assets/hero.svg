<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">genie</title>
  <desc id="desc">genie: a self-hosted server where people set tasks and an orchestrator assembles focused teams of AI agents to do them.</desc>
  <defs>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#7c84f0" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7c84f0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#25272e"/>
      <stop offset="1" stop-color="#1c1e23"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#17181c" stroke-width="1"/>
    </pattern>
    <clipPath id="panel"><rect x="0" y="0" width="1280" height="400" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#panel)">
    <rect width="1280" height="400" fill="#0c0d0f"/>
    <rect width="1280" height="400" fill="url(#grid)"/>
    <rect width="1280" height="400" fill="url(#glow)"/>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="399" rx="16" fill="none" stroke="url(#edge)"/>

  <!-- wordmark -->
  <g font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <g transform="translate(80 103)">
      <rect width="44" height="44" rx="11" fill="#1a1c2b" stroke="#2e3150"/>
      <svg x="7" y="5" width="30" height="34" viewBox="300 160 500 570">
        <path fill="#9ca3f5" fill-rule="evenodd" d="M667 278C710 293 762 260 767 237C773 212 750 188 726 190C699 190 691 207 680 224C667 247 651 253 625 248C567 233 525 234 483 246C421 264 394 305 391 347C388 397 417 427 469 443L507 452C467 468 415 482 378 513C342 543 326 573 342 609C363 648 411 662 461 662C489 662 516 660 535 657C539 656 537 652 533 650C516 638 487 628 461 618C430 608 411 589 414 568C415 558 417 550 420 542C438 514 477 491 509 476C503 495 519 507 544 518C575 532 632 545 649 569C671 598 653 623 626 644C600 664 549 677 509 687C500 689 501 696 511 695C580 687 652 666 689 628C716 596 712 563 688 539C662 512 608 497 570 484C546 476 536 470 551 465C599 452 644 429 671 400C695 374 700 337 686 308C680 295 673 285 667 278ZM614 343C615 302 593 275 559 270C521 265 489 291 480 326C469 365 479 402 509 416C540 432 576 417 596 393C607 380 613 361 614 343Z"/>
      </svg>
    </g>
    <text x="80" y="217" fill="#ecedef" font-size="76" font-weight="600" letter-spacing="-2">genie</text>
    <text x="82" y="265" fill="#b4b7be" font-size="24">Tasks, knowledge and teams of AI agents,</text>
    <text x="82" y="297" fill="#b4b7be" font-size="24">on one self-hosted server.</text>
  </g>

  <!-- links orchestrator → team -->
  <g stroke="#2e3150" stroke-width="1.5" fill="none">
    <path d="M900 200C960 200 960 96 1030 96"/>
    <path d="M900 200C970 200 980 148 1060 148"/>
    <path d="M900 200H1084"/>
    <path d="M900 200C970 200 980 252 1060 252"/>
    <path d="M900 200C960 200 960 304 1030 304"/>
  </g>
  <path d="M900 200H1084" stroke="#7c84f0" stroke-width="1.5" stroke-dasharray="4 6" fill="none"/>

  <!-- orchestrator -->
  <circle cx="860" cy="200" r="58" fill="#7c84f0" opacity="0.08"/>
  <circle cx="860" cy="200" r="40" fill="#16171b" stroke="#7c84f0" stroke-width="2"/>
  <circle cx="860" cy="200" r="14" fill="#7c84f0"/>

  <!-- people -->
  <g fill="#8b8f98">
    <circle cx="700" cy="150" r="9"/>
    <circle cx="700" cy="200" r="9"/>
    <circle cx="700" cy="250" r="9"/>
  </g>
  <g stroke="#25272e" stroke-width="1.5" fill="none">
    <path d="M712 150C770 150 780 200 820 200"/>
    <path d="M712 200H820"/>
    <path d="M712 250C770 250 780 200 820 200"/>
  </g>

  <g font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#5c606a" text-anchor="middle" letter-spacing="1">
    <text x="700" y="300">PEOPLE</text>
    <text x="860" y="300">ORCHESTRATOR</text>
  </g>

  <!-- team: analyst, executor, tester, reviewer, documenter -->
  <g font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#8a8e97">
    <circle cx="1044" cy="96" r="13" fill="#4ea7fc"/><text x="1068" y="101">analyst</text>
    <circle cx="1074" cy="148" r="13" fill="#f2994a"/><text x="1098" y="153">executor</text>
    <circle cx="1098" cy="200" r="13" fill="#4cb782"/><text x="1122" y="205">tester</text>
    <circle cx="1074" cy="252" r="13" fill="#9b8afb"/><text x="1098" y="257">reviewer</text>
    <circle cx="1044" cy="304" r="13" fill="#e0b84a"/><text x="1068" y="309">documenter</text>
  </g>
</svg>
