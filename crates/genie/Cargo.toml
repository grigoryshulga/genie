[package]
name = "genie"
description = "Genie server and CLI."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "genie"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive", "string"] }
futures-util = { version = "0.3.34", default-features = false }
genie-core = { path = "../genie-core" }
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "builder", "tokio1", "tokio1-rustls", "rustls-platform-verifier", "aws-lc-rs"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
# JSON schemas of the operations' arguments (MCP tools).
schemars = "1.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "process", "sync", "io-util", "fs"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs"] }
ts-rs = { version = "12.0.1", features = ["serde-json-impl", "no-serde-warnings"] }

[build-dependencies]
brotli = "9.0.0"
flate2 = "1.1.10"

[dev-dependencies]
base64 = "0.23.1"
chrono = "0.4.45"
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
