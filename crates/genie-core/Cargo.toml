[package]
name = "genie-core"
description = "Genie domain core: task tracker, role workflow, event journal (SQLite)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
argon2 = "0.5"
chacha20poly1305 = "0.10"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10.4"
cron = "0.17.0"
getrandom = "0.4.3"
hex = "0.4.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"
# TypeScript types of the API for the web (`cargo test` writes them to web/src/shared/api/generated).
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"] }

[dev-dependencies]
tempfile = "3.27.0"
