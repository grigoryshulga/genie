<svg xmlns="http://www.w3.org/2000/svg" class="a-sleep" viewBox="0 0 880 780" fill="none">
  <title>Falling asleep</title>
  <desc>The character blinks heavily, droops, closes its eye into a sleeping curve, snores softly, then startles awake.</desc>
  <style>
.a-sleep { --g: #008f6b; --o: #ff873c; --p: #f4f1ea; }
.a-sleep * { transform-box: view-box; }
.a-sleep .sparks, .a-sleep .z1, .a-sleep .z2, .a-sleep .z3, .a-sleep .d1, .a-sleep .d2, .a-sleep .d3 { opacity: 0; }
.a-sleep .lb { transform: scaleY(0); transform-origin: 295px 383px; }
.a-sleep .all { transform-origin: 270px 750px; animation: sleep-all 8s cubic-bezier(.45,0,.25,1) infinite; }
.a-sleep .head { transform-origin: 280px 550px; animation: sleep-head 8s cubic-bezier(.45,0,.25,1) infinite; }
.a-sleep .handle { transform-origin: 432px 302px; animation: sleep-handle 8s cubic-bezier(.45,0,.25,1) infinite; }
.a-sleep .eye { transform-origin: 295px 383px; animation: sleep-eye 8s cubic-bezier(.45,0,.25,1) infinite; }
.a-sleep .lt { transform-origin: 295px 383px; animation: sleep-lt 8s cubic-bezier(.45,0,.25,1) infinite; }
.a-sleep .lb { transform-origin: 295px 383px; animation: sleep-lb 8s cubic-bezier(.45,0,.25,1) infinite; }
.a-sleep .z1 { transform-origin: 610px 400px; animation: sleep-z1 8s cubic-bezier(.45,0,.25,1) infinite; }
.a-sleep .z2 { transform-origin: 665px 335px; animation: sleep-z2 8s cubic-bezier(.45,0,.25,1) infinite; }
.a-sleep .z3 { transform-origin: 735px 255px; animation: sleep-z3 8s cubic-bezier(.45,0,.25,1) infinite; }
@keyframes sleep-all { 0% { transform: translate(0,0px) scale(1,1) } 48% { transform: translate(0,0px) scale(1.02,0.95) } 56% { transform: translate(0,0px) scale(1.015,0.965) } 64% { transform: translate(0,0px) scale(1.02,0.95) } 72% { transform: translate(0,0px) scale(1.015,0.965) } 82% { transform: translate(0,0px) scale(1.02,0.95) } 88% { transform: translate(0,-10px) scale(0.97,1.06) } 94% { transform: translate(0,0px) scale(1,1) } 100% { transform: translate(0,0px) scale(1,1) } }
@keyframes sleep-head { 0% { transform: rotate(0deg) } 14% { transform: rotate(2deg) } 26% { transform: rotate(3deg) } 32% { transform: rotate(1deg) } 40% { transform: rotate(5deg) } 48% { transform: rotate(7deg) } 82% { transform: rotate(7deg) } 88% { transform: rotate(-3deg) } 94% { transform: rotate(0deg) } 100% { transform: rotate(0deg) } }
@keyframes sleep-handle { 0% { transform: rotate(0deg) } 40% { transform: rotate(25deg) } 48% { transform: rotate(58deg) } 82% { transform: rotate(58deg) } 88% { transform: rotate(-20deg) } 94% { transform: rotate(0deg) } 100% { transform: rotate(0deg) } }
@keyframes sleep-eye { 0% { transform: scale(1) } 100% { transform: scale(1) } }
@keyframes sleep-lt { 0% { transform: scaleY(1); stroke-width: 40px } 8% { transform: scaleY(1); stroke-width: 40px } 12% { transform: scaleY(.1); stroke-width: 40px } 16% { transform: scaleY(.85); stroke-width: 40px } 26% { transform: scaleY(.08); stroke-width: 40px } 32% { transform: scaleY(.55); stroke-width: 40px } 40% { transform: scaleY(.08); stroke-width: 40px } 46% { transform: scaleY(-1.1); stroke-width: 16px } 50% { transform: scaleY(-1); stroke-width: 16px } 82% { transform: scaleY(-1); stroke-width: 16px } 88% { transform: scaleY(-.2); stroke-width: 16px } 94% { transform: scaleY(1); stroke-width: 40px } 100% { transform: scaleY(1); stroke-width: 40px } }
@keyframes sleep-lb { 0% { transform: scaleY(0) } 100% { transform: scaleY(0) } }
@keyframes sleep-z1 { 0% { opacity: 0; transform: translate(0,0) scale(.7) } 52% { opacity: 0; transform: translate(0,0) scale(.7) } 57.5% { opacity: 0.95; transform: translate(8px,-14px) scale(.9) } 74% { opacity: 0; transform: translate(26px,-60px) scale(1.1) } 100% { opacity: 0; transform: translate(26px,-60px) scale(1.1) } }
@keyframes sleep-z2 { 0% { opacity: 0; transform: translate(0,0) scale(.7) } 60% { opacity: 0; transform: translate(0,0) scale(.7) } 65.5% { opacity: 0.95; transform: translate(8px,-14px) scale(.9) } 82% { opacity: 0; transform: translate(26px,-60px) scale(1.1) } 100% { opacity: 0; transform: translate(26px,-60px) scale(1.1) } }
@keyframes sleep-z3 { 0% { opacity: 0; transform: translate(0,0) scale(.7) } 68% { opacity: 0; transform: translate(0,0) scale(.7) } 73% { opacity: 0.95; transform: translate(8px,-14px) scale(.9) } 88% { opacity: 0; transform: translate(26px,-60px) scale(1.1) } 100% { opacity: 0; transform: translate(26px,-60px) scale(1.1) } }
.a-sleep.paused * { animation-play-state: paused; }
@media (prefers-reduced-motion: reduce) { .a-sleep * { animation: none !important; } }
  </style>
  <g class="all">
    <g class="body" fill="none" stroke="var(--g)">
      <rect x="72" y="568" width="390" height="144" rx="72" stroke-width="76"/>
      <path d="M170 428C110 418 78 470 92 522C96 540 98 550 100 568" stroke-width="66"/>
    </g>
    <g class="head" fill="none" stroke="var(--g)">
      <circle cx="294" cy="379" r="136" stroke-width="70"/>
      <g class="handle"><path d="M436 304L560 253" stroke-width="56"/></g>
      <g class="eye" stroke="var(--o)" stroke-width="40">
        <path class="lt" d="M233 383.5A62 62 0 0 1 357 383.5"/>
        <g class="lb">
          <path d="M233 382.5A62 62 0 0 0 357 382.5"/>
          <!-- Opaque patches over the join with the upper half, so the full ring has no antialiasing seam. -->
          <path d="M213 378H253V388H213ZM337 378H377V388H337Z" fill="var(--o)" stroke="none"/>
        </g>
      </g>
    </g>
  </g>
  <g class="z1"><path transform="translate(610 400) scale(0.7)" d="M0 0H40L0 52H40" fill="none" stroke="var(--p)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g class="z2"><path transform="translate(665 335) scale(0.9)" d="M0 0H40L0 52H40" fill="none" stroke="var(--p)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g class="z3"><path transform="translate(735 255) scale(1.15)" d="M0 0H40L0 52H40" fill="none" stroke="var(--p)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></g>
</svg>
