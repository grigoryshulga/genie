<svg xmlns="http://www.w3.org/2000/svg" class="a-wake" viewBox="0 0 880 780" fill="none">
  <title>Waking up</title>
  <desc>Asleep with a drooping antenna, the character stirs, stretches, opens its eye wide, blinks, and drifts back off.</desc>
  <style>
.a-wake { --g: #008f6b; --o: #ff873c; --p: #f4f1ea; }
.a-wake * { transform-box: view-box; }
.a-wake .sparks, .a-wake .z1, .a-wake .z2, .a-wake .z3, .a-wake .d1, .a-wake .d2, .a-wake .d3 { opacity: 0; }
.a-wake .lb { transform: scaleY(0); transform-origin: 295px 383px; }
.a-wake .all { transform-origin: 270px 750px; animation: wake-all 7s cubic-bezier(.45,0,.25,1) infinite; }
.a-wake .head { transform-origin: 280px 550px; animation: wake-head 7s cubic-bezier(.45,0,.25,1) infinite; }
.a-wake .handle { transform-origin: 432px 302px; animation: wake-handle 7s cubic-bezier(.45,0,.25,1) infinite; }
.a-wake .eye { transform-origin: 295px 383px; animation: wake-eye 7s cubic-bezier(.45,0,.25,1) infinite; }
.a-wake .lt { transform-origin: 295px 383px; animation: wake-lt 7s cubic-bezier(.45,0,.25,1) infinite; }
.a-wake .lb { transform-origin: 295px 383px; animation: wake-lb 7s cubic-bezier(.45,0,.25,1) infinite; }
.a-wake .z1 { transform-origin: 610px 400px; animation: wake-z1 7s cubic-bezier(.45,0,.25,1) infinite; }
.a-wake .z2 { transform-origin: 665px 335px; animation: wake-z2 7s cubic-bezier(.45,0,.25,1) infinite; }
.a-wake .z3 { transform-origin: 735px 255px; animation: wake-z3 7s cubic-bezier(.45,0,.25,1) infinite; }
@keyframes wake-all { 0% { transform: translate(0,0px) scale(1.02,0.95) } 8% { transform: translate(0,0px) scale(1.015,0.965) } 16% { transform: translate(0,0px) scale(1.02,0.95) } 24% { transform: translate(0,0px) scale(1.02,0.95) } 44% { transform: translate(0,0px) scale(1,0.97) } 52% { transform: translate(0,-14px) scale(0.95,1.1) } 62% { transform: translate(0,0px) scale(1.04,0.96) } 70% { transform: translate(0,0px) scale(1,1) } 88% { transform: translate(0,0px) scale(1,1) } 100% { transform: translate(0,0px) scale(1.02,0.95) } }
@keyframes wake-head { 0% { transform: rotate(6deg) } 36% { transform: rotate(5deg) } 46% { transform: rotate(0deg) } 52% { transform: rotate(-5deg) } 62% { transform: rotate(2deg) } 70% { transform: rotate(0deg) } 88% { transform: rotate(0deg) } 100% { transform: rotate(6deg) } }
@keyframes wake-handle { 0% { transform: rotate(55deg) } 44% { transform: rotate(45deg) } 52% { transform: rotate(-30deg) } 60% { transform: rotate(10deg) } 66% { transform: rotate(-6deg) } 72% { transform: rotate(0deg) } 88% { transform: rotate(0deg) } 100% { transform: rotate(55deg) } }
@keyframes wake-eye { 0% { transform: scale(1) } 100% { transform: scale(1) } }
@keyframes wake-lt { 0% { transform: scaleY(-1); stroke-width: 16px } 24% { transform: scaleY(-1); stroke-width: 16px } 26% { transform: scaleY(-.15); stroke-width: 16px } 30% { transform: scaleY(-1); stroke-width: 16px } 44% { transform: scaleY(.08); stroke-width: 40px } 52% { transform: scaleY(.6); stroke-width: 40px } 56% { transform: scaleY(1.25); stroke-width: 40px } 62% { transform: scaleY(1); stroke-width: 40px } 80% { transform: scaleY(1); stroke-width: 40px } 83% { transform: scaleY(.08); stroke-width: 40px } 86% { transform: scaleY(1); stroke-width: 40px } 90% { transform: scaleY(1); stroke-width: 40px } 100% { transform: scaleY(-1); stroke-width: 16px } }
@keyframes wake-lb { 0% { transform: scaleY(0) } 100% { transform: scaleY(0) } }
@keyframes wake-z1 { 0% { opacity: 0; transform: translate(0,0) scale(.7) } 2% { opacity: 0; transform: translate(0,0) scale(.7) } 7% { opacity: 0.95; transform: translate(8px,-14px) scale(.9) } 22% { opacity: 0; transform: translate(26px,-60px) scale(1.1) } 100% { opacity: 0; transform: translate(26px,-60px) scale(1.1) } }
@keyframes wake-z2 { 0% { opacity: 0; transform: translate(0,0) scale(.7) } 8% { opacity: 0; transform: translate(0,0) scale(.7) } 14.5% { opacity: 0.95; transform: translate(8px,-14px) scale(.9) } 34% { opacity: 0; transform: translate(26px,-60px) scale(1.1) } 100% { opacity: 0; transform: translate(26px,-60px) scale(1.1) } }
@keyframes wake-z3 { 0% { opacity: 0; transform: translate(0,0) scale(.7) } 14% { opacity: 0; transform: translate(0,0) scale(.7) } 21% { opacity: 0.95; transform: translate(8px,-14px) scale(.9) } 42% { opacity: 0; transform: translate(26px,-60px) scale(1.1) } 100% { opacity: 0; transform: translate(26px,-60px) scale(1.1) } }
.a-wake.paused * { animation-play-state: paused; }
@media (prefers-reduced-motion: reduce) { .a-wake * { animation: none !important; } }
  </style>
  <g class="all">
    <g class="body" fill="none" stroke="var(--g)">
      <rect x="72" y="568" width="390" height="144" rx="72" stroke-width="76"/>
      <path d="M170 428C110 418 78 470 92 522C96 540 98 550 100 568" stroke-width="66"/>
    </g>
    <g class="head" fill="none" stroke="var(--g)">
      <circle cx="294" cy="379" r="136" stroke-width="70"/>
      <g class="handle"><path d="M436 304L560 253" stroke-width="56"/></g>
      <g class="eye" stroke="var(--o)" stroke-width="40">
        <path class="lt" d="M233 383.5A62 62 0 0 1 357 383.5"/>
        <g class="lb">
          <path d="M233 382.5A62 62 0 0 0 357 382.5"/>
          <!-- Opaque patches over the join with the upper half, so the full ring has no antialiasing seam. -->
          <path d="M213 378H253V388H213ZM337 378H377V388H337Z" fill="var(--o)" stroke="none"/>
        </g>
      </g>
    </g>
  </g>
  <g class="z1"><path transform="translate(610 400) scale(0.7)" d="M0 0H40L0 52H40" fill="none" stroke="var(--p)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g class="z2"><path transform="translate(665 335) scale(0.9)" d="M0 0H40L0 52H40" fill="none" stroke="var(--p)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g class="z3"><path transform="translate(735 255) scale(1.15)" d="M0 0H40L0 52H40" fill="none" stroke="var(--p)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></g>
</svg>
