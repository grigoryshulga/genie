# Overlay: provider keys and tokens from files instead of environment variables.
#
#   mkdir -p docker/secrets && chmod 700 docker/secrets
#   printf '%s' 'sk-…' > docker/secrets/litellm_api_key && chmod 600 docker/secrets/litellm_api_key
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.secrets.yml up -d
#
# The entrypoint turns NAME_FILE=/run/secrets/x into NAME=<contents> (names ending in _API_KEY, _TOKEN,
# _PASSWORD, _SECRET), so the server and every agent it starts see LITELLM_API_KEY. Add a secret the same
# way for each MCP server or token (GITHUB_TOKEN_FILE, JIRA_API_TOKEN_FILE, …).

services:
  genie:
    environment:
      LITELLM_API_KEY_FILE: /run/secrets/litellm_api_key
    secrets:
      - litellm_api_key

secrets:
  litellm_api_key:
    file: ./secrets/litellm_api_key
